<header class="navbar">
  <div class="logo">
    <a href="#hero">
      <img src="images/logo.jpeg" alt="Logo Elí Aramburo">
    </a>
  </div>
  <nav>
    <ul class="nav-links">
      <li><a href="#hero">Inicio</a></li>
      <li><a href="#semblanza">Semblanza</a></li>
      <li><a href="#portafolio">Portafolio</a></li>
      <li><a href="#paquetes">Paquetes</a></li>
      <li><a href="#contacto">Contacto</a></li>
    </ul>
  </nav>

  <button class="btn-admin" (click)="toggleAdmin()">
    {{ adminService.isAdmin() ? 'Cerrar Sesión' : 'Iniciar Sesión' }}
  </button>

  @if (showLoginModal()) {
    <div class="modal-overlay" (click)="closeLoginModal()">
      <div class="modal-content" (click)="$event.stopPropagation()">
        <button class="close-btn" (click)="closeLoginModal()">✕</button>
        <app-login></app-login>
      </div>
    </div>
  }
</header>
