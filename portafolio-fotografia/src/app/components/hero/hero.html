<section id="hero" class="hero-section" [style.background-image]="'url(' + heroImageUrl() + ')'">  <div class="hero-content">
    <h1>ELÍ ARAMBURO</h1>
    <p>Capturando la esencia de tus momentos más preciados.</p>
    <a href="#portafolio" class="btn-ver-portafolio">Ver Portafolio</a>
  </div>

  @if (adminService.isAdmin()) {
    @if (!isEditing()) {
      <button class="edit-hero-btn" (click)="activarEdicion()">
        <i class="bi bi-pencil-fill"></i> Editar Imagen
      </button>
    } @else {
      <div class="hero-edit-modal">
        <input type="file" (change)="onFileSelected($event)" accept="image/*">
        <button (click)="guardarNuevaImagen()">Guardar</button>
        <button (click)="isEditing.set(false)">Cancelar</button>
      </div>
    }
  }
</section>
