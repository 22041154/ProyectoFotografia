<section id="semblanza" class="about-section">
  <div class="about-container">
    <div class="about-image">
      <img src="https://images.unsplash.com/photo-1469474968028-56623f02e42e?q=80&w=800&auto=format&fit=crop" alt="Sobre el Artista">
    </div>
    
    <div class="about-text">
      <h2>Sobre el Artista</h2>

      @if (!isEditing()) {
        <p class="semblanza-content">{{ semblanzaText() }}</p>

        @if (adminService.isAdmin()) {
          <button class="edit-btn-black" (click)="activarEdicion()">
            <i class="bi bi-pencil-fill"></i> Editar Texto
          </button>
        }
      } 
      @else {
        <div class="edit-mode-container">
          <textarea #semblanzaInput rows="8" class="edit-textarea" [value]="semblanzaText()"></textarea>
          
          <div class="edit-actions">
            <button class="btn-save-red" (click)="guardarCambios(semblanzaInput.value)">
              Guardar Cambios
            </button>
            <button class="btn-cancel" (click)="cancelarEdicion()">
              Cancelar
            </button>
          </div>
        </div>
      }
    </div>
    
  </div>
</section>
