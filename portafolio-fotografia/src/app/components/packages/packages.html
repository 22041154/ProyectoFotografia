<section id="paquetes" class="packages-section">
  <div class="packages-header">
    <h2>Paquetes de Servicios</h2>
    <p>Soluciones a la medida.</p>
  </div>
  @if (adminService.isAdmin()) {
  <div class="admin-package-card">
    <h3><i class="bi bi-tags-fill"></i> Administrar Paquetes</h3>
    <div class="field">
      <label>Etiqueta (Ej: XV Años)</label>
      <input type="text" placeholder="XV Años">
    </div>
    <div class="field">
      <label>Título del Paquete</label>
      <input type="text" placeholder="Paquete Básico">
    </div>
    <div class="field">
      <label>Precio</label>
      <input type="text" placeholder="$500">
    </div>
    <div class="field">
      <label>Características (Sepáralas con comas)</label>
      <textarea placeholder="Ej: 5 horas, 30 fotos, Edición digital"></textarea>
    </div>
    <button class="btn-save-red">Guardar</button>
  </div>
}

  <div class="packages-content">
    <p class="error-msg-red">Error al cargar paquetes.</p>
  </div>
</section>
