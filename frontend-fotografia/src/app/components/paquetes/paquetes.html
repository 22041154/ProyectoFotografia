<div class="paquetes">
  <div class="paquetes-header">
    <h2>Paquetes de Servicios</h2>
    <p>Soluciones a la medida.</p>
  </div>

  <div class="cards">
    <div class="card" *ngFor="let paquete of paquetes" [class.destacado]="paquete.destacado">
      <div class="card-badge" *ngIf="paquete.destacado">Más popular</div>
      <h3>{{ paquete.nombre }}</h3>
      <div class="precio">
        <span class="monto">{{ paquete.precio }}</span>
        <span class="moneda">MXN</span>
      </div>
      <p class="descripcion">{{ paquete.descripcion }}</p>
      <ul class="beneficios">
        <li *ngFor="let b of paquete.beneficios">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24"
            fill="none" stroke="currentColor" stroke-width="2.5">
            <polyline points="20 6 9 17 4 12"/>
          </svg>
          {{ b }}
        </li>
      </ul>
      <a href="#contacto" class="card-btn">Contratar</a>
    </div>
  </div>
</div>
