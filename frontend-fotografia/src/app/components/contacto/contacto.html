<div class="contacto">
  <div class="contacto-header">
    <h2>Contacto</h2>
    <p>Hablemos.</p>
  </div>

  <div class="contacto-contenido">
    <div class="contacto-info">
      <h3>Sígueme y contáctame</h3>
      <ul class="info-lista">
        <li>
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <rect x="2" y="2" width="20" height="20" rx="5" ry="5"/>
            <circle cx="12" cy="12" r="4"/>
            <circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"/>
          </svg>
          <a href="https://instagram.com/eli_aramburo_fotografia_" target="_blank">&#64;eli_aramburo_fotografia_</a>
        </li>
        <li>
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <rect x="2" y="4" width="20" height="16" rx="2"/>
            <polyline points="2,4 12,13 22,4"/>
          </svg>
          <a href="mailto:eli.aramburo.h@gmail.com">eli.aramburo.h&#64;gmail.com</a>
        </li>
        <li>
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07A19.5 19.5 0 0 1 4.69 12 19.79 19.79 0 0 1 1.61 3.44 2 2 0 0 1 3.59 1.26h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L7.91 8.96a16 16 0 0 0 6 6l.92-.92a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 21.73 16.92z"/>
          </svg>
          <a href="https://wa.me/521XXXXXXXXXX" target="_blank">WhatsApp Directo</a>
        </li>
        <li>
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7z"/>
            <circle cx="12" cy="9" r="2.5"/>
          </svg>
          <span><strong>Durango, México.</strong></span>
        </li>
      </ul>
    </div>

    <div class="contacto-form">
      <h3>Envíame un mensaje</h3>
      <div class="form-group">
        <input type="text" placeholder="Tu nombre" [(ngModel)]="nombre" />
      </div>
      <div class="form-group">
        <input type="email" placeholder="Tu correo" [(ngModel)]="correo" />
      </div>
      <div class="form-group">
        <textarea placeholder="Tu mensaje" rows="5" [(ngModel)]="mensaje"></textarea>
      </div>
      <button class="enviar-btn" (click)="enviarWhatsApp()">Enviar por WhatsApp</button>
    </div>
  </div>
</div>
