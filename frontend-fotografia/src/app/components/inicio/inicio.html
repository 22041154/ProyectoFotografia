<div class="hero">
  <div class="hero-overlay"></div>
  <div class="hero-content">
    <h1 class="hero-title">ELÍ ARAMBURO</h1>
    <p class="hero-subtitle">Capturando la esencia de tus momentos más preciados.</p>
    <a href="#portafolio" class="hero-btn">Ver Portafolio</a>
  </div>
</div>
<section class="portfolio-container">
  <header class="hero-header">
    <h1>Galería</h1>
    <p>Mi perspectiva a través de la lente</p>
  </header>

  <div class="masonry-grid">
    @for (foto of fotos; track foto.id) {
      <article class="photo-card">
        <img [src]="foto.url" [alt]="foto.titulo">
        <div class="overlay">
          <h3>{{ foto.titulo }}</h3>
        </div>
      </article>
    }
  </div>
</section>
